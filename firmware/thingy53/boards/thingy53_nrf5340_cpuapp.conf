# Allow future firmware updates over Bluetooth with the nRF Programmer / nRF Connect Device
# Manager mobile apps, like the Thingy:53 factory firmware.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=4096
# SMP (DFU) service needs a second connection slot next to the computer.
CONFIG_BT_MAX_CONN=2
